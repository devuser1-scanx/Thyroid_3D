        <h1>Thyroid 3D Video Portal</h1>
        <p class="subtitle">Enter your details to retrieve your video</p>

        <div id="statusMessage" class="message"></div>

        <div class="form-section">
            <form id="videoForm">
                <div class="form-group">
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" name="first_name" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" name="last_name" required>
                </div>

                <div class="form-group">
                    <label for="apptdate">Appointment Date *</label>
                    <input type="date" id="apptdate" name="apptdate" required>
                </div>

                <button type="submit" class="btn-submit">Submit</button>
            </form>
        </div>
    </div>

<script>
    const form = document.getElementById("videoForm");
    const statusMessage = document.getElementById("statusMessage");

    function showMessage(message, type) {
        statusMessage.textContent = message;
        statusMessage.className = `message ${type}`;
        statusMessage.style.display = 'block';
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const firstName = document.getElementById("firstName").value;
        const lastName = document.getElementById("lastName").value;
        const apptdate = document.getElementById("apptdate").value;

        // Show loading state
        const submitBtn = form.querySelector('.btn-submit');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Loading...';
        submitBtn.disabled = true;

        try {
            const response = await fetch("/fetch-video", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    firstName,
                    lastName,
                    apptdate
                })
            });

            const data = await response.json();
            
            console.log('Response received:', data);

            if (response.ok && data.success && data.videoUrls && data.videoUrls.length > 0) {
                showMessage(`${data.videoUrls.length} video(s) found! Redirecting...`, "success");

                // Store data in sessionStorage
                sessionStorage.setItem('videoData', JSON.stringify(data.videoUrls));
                sessionStorage.setItem('patientInfo', JSON.stringify({
                    firstName,
                    lastName,
                    apptdate
                }));
                
                console.log('Data stored, redirecting...');
                
                // Redirect after a short delay
                setTimeout(() => {
                    window.location.href = "/video-player";
                }, 500);
            } else {
                showMessage(data.message || "Not Found.", "error");
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }

        } catch (error) {
            console.error('Error:', error);
            showMessage("Something went wrong. Please try again.", "error");
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
        }
    });
</script>
</body>
